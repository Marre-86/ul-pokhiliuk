services:
    app:
        build:
            context: ./
            dockerfile: docker/app.dockerfile
        working_dir: /var/www
        environment:
            - XDEBUG_MODE=coverage
        volumes:
            - ./:/var/www
        depends_on:
            - "database"
            - "rabbitmq"
            - "redis"
    web:
        build:
            context: ./
            dockerfile: docker/web.dockerfile
        working_dir: /var/www
        volumes:
            - ./:/var/www
        ports:
            - 80:80
        depends_on:
            - "app"

    database:
        image: postgres:16
        command:
            - "postgres"
            - "-c"
            - "max_connections=100"
            - "-c"
            - "shared_buffers=256MB"
        volumes:
            - dbdata:/var/lib/postgresql/data
            - ./docker/postgres.conf:/etc/postgresql/postgresql.conf
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USERNAME}
        ports:
            - 54321:5432
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 6s
            timeout: 3s
            retries: 10

    rabbitmq:
        image: rabbitmq:4.3-management
        ports:
            - 15672:15672  # веб‑интерфейс (GUI)
            - 5672:5672    # AMQP‑порт
        environment:
            - RABBITMQ_DEFAULT_USER=guest
            - RABBITMQ_DEFAULT_PASS=guest
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq

    queue-worker-high:
        image: ul-pokhiliuk-app
        container_name: app-queue-worker-high
        working_dir: /var/www
        volumes:
            - .:/var/www
        depends_on:
            database:
                condition: service_healthy
            app:
                condition: service_started
            rabbitmq:
                condition: service_started
        command: >
            sh -c "
                php artisan queue:work rabbitmq --queue=high-priority --timeout=0 --sleep=3 --tries=3
            "
        restart: unless-stopped

    queue-worker-low:
        image: ul-pokhiliuk-app
        container_name: app-queue-worker-low
        working_dir: /var/www
        volumes:
            - .:/var/www
        depends_on:
            database:
                condition: service_healthy
            app:
                condition: service_started
            rabbitmq:
                condition: service_started
        command: >
            sh -c "
                php artisan queue:work rabbitmq --queue=low-priority --timeout=0 --sleep=3 --tries=3
            "
        restart: unless-stopped

    redis:
        image: redis:alpine
        container_name: redis
        ports:
            - 6379:6379
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes

volumes:
    dbdata:
    rabbitmq_data:
    redis_data: